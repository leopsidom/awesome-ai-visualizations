<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anemoi — a wind farm on a grass steppe</title>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <style>
      :root {
        --ink: #2a2417;
        --dim: #6a5c42;
        --glow: #8a6a1c;
        /* The splash colour, and the page behind the canvas. Matched to the mean
           tone of a settled frame so the hand-off to the scene is a dissolve
           rather than a bright card being pulled away from a dark landscape. */
        --field: #8d887f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--field);
        overflow: hidden;
        color: var(--ink);
        font: 400 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
      }

      canvas {
        display: block;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      #ui.hidden {
        opacity: 0;
      }

      /* The sky runs from bright cream at the horizon to deep blue overhead and
         the ground goes dark against it, so every glyph carries its own halo
         instead of picking one ink and hoping. */
      .title,
      .legend,
      .stat {
        text-shadow:
          0 0 14px rgba(255, 246, 226, 0.92),
          0 0 3px rgba(255, 246, 226, 0.92);
      }

      .title {
        position: absolute;
        top: 24px;
        left: 24px;
      }

      .title h1 {
        margin: 0;
        font: 300 26px/1.1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      .title p {
        margin: 8px 0 0;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .legend {
        position: absolute;
        left: 24px;
        bottom: 24px;
        color: var(--dim);
        font-size: 11px;
      }

      .legend b {
        color: var(--ink);
        font-weight: 500;
      }

      .legend span {
        display: inline-block;
        min-width: 74px;
      }

      .stat {
        position: absolute;
        right: 24px;
        bottom: 24px;
        text-align: right;
        color: var(--dim);
        font-size: 11px;
        line-height: 1.75;
      }

      .stat b {
        color: var(--glow);
        font-weight: 500;
      }

      .stat i {
        display: inline-block;
        min-width: 52px;
        font-style: normal;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.72;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: var(--field);
        color: var(--ink);
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        transition: opacity 0.9s ease;
        z-index: 2;
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      #boot .pip {
        width: 96px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--glow), transparent);
        animation: sweep 1.6s ease-in-out infinite;
      }

      @keyframes sweep {
        0%,
        100% {
          opacity: 0.2;
          transform: scaleX(0.4);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @media (max-width: 640px) {
        .title h1 {
          font-size: 18px;
          letter-spacing: 0.3em;
        }
        .legend {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <div class="title">
        <h1>Anemoi</h1>
        <p>Wind farm &mdash; an hour before sunset</p>
      </div>

      <div class="legend">
        <div><span>space</span> <b>still the air</b></div>
        <div><span>O</span> <b>free orbit</b></div>
        <div><span>B</span> <b>bloom</b></div>
        <div><span>G</span> <b>get up a wind</b></div>
        <div><span>R</span> <b>new weather</b></div>
        <div><span>H</span> <b>hide overlay</b></div>
      </div>

      <div class="stat">
        <i>wind</i> <b id="wind">&mdash;</b><br />
        <i>from</i> <b id="bearing">&mdash;</b><br />
        <i>output</i> <b id="output">&mdash;</b><br />
        <i>seed</i> <b id="seed">&mdash;</b><br />
        <span id="mode">running</span>
      </div>
    </div>

    <div id="boot">
      <div>walking out</div>
      <div class="pip"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
