<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anemoi — a wind farm on a grass steppe</title>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <style>
      :root {
        /* Two inks, because the overlay sits on two different pictures — see the
           note by the text-shadow rules below. */
        --ink: #241f13;
        --ink-dim: rgba(36, 31, 19, 0.74);
        --paper: #fbf6ea;
        --paper-dim: rgba(251, 246, 234, 0.72);
        --glow: #ffd489;
        /* The gallery's own background, so arriving here is not a step change. */
        --night: #02030a;
        /* The splash colour, and the page behind the canvas. Matched to the mean
           tone of a settled frame so the hand-off to the scene is a dissolve
           rather than a bright card being pulled away from a dark landscape. */
        --field: #8d887f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--night);
        overflow: hidden;
        color: var(--ink);
        font: 400 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
      }

      canvas {
        display: block;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      #ui.hidden {
        opacity: 0;
      }

      /* The overlay sits on two different pictures, and they do not move: the
         title is always against sky, which measures around 160 in luminance
         through the whole camera cycle, and the legend and readout are always
         against near-field grass, which measures around 65. One ink cannot serve
         both. The previous attempt used dark ink everywhere under a 14 px halo,
         which meant the halo was doing all of the separating — and a glyph read
         through its own glow is exactly what soft type looks like. Each block now
         takes the ink its own background asks for, and the shadows are tight
         enough to be an edge rather than a cloud. */
      .title {
        position: absolute;
        top: 24px;
        left: 24px;
        color: var(--ink);
        text-shadow: 0 0 7px rgba(255, 249, 235, 0.6);
      }

      .legend,
      .stat {
        color: var(--paper);
        text-shadow:
          0 1px 2px rgba(20, 15, 6, 0.9),
          0 0 3px rgba(20, 15, 6, 0.65);
      }

      .title h1 {
        margin: 0;
        font: 300 26px/1.1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.42em;
        text-transform: uppercase;
      }

      .title p {
        margin: 8px 0 0;
        color: var(--ink-dim);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .legend {
        position: absolute;
        left: 24px;
        bottom: 24px;
        color: var(--paper-dim);
        font-size: 11px;
      }

      .legend b {
        color: var(--paper);
        font-weight: 500;
      }

      .legend span {
        display: inline-block;
        min-width: 74px;
      }

      .stat {
        position: absolute;
        right: 24px;
        bottom: 24px;
        text-align: right;
        color: var(--paper-dim);
        font-size: 11px;
        line-height: 1.75;
      }

      .stat b {
        color: var(--glow);
        font-weight: 500;
      }

      .stat i {
        display: inline-block;
        min-width: 52px;
        font-style: normal;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0.72;
      }

      /* The splash opens in the gallery's own near-black, so clicking a card is
         not a cut — measured, that jump was luminance 20 to 136 in a single frame
         — and then warms to the tone of a settled frame while the world is being
         built. With the hand-off at the far end already matched, the whole load
         is now one monotonic ramp from the gallery to the steppe. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: var(--night);
        color: var(--paper-dim);
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        transition: opacity 0.9s ease;
        animation: dawn 0.85s ease-out 0.12s forwards;
        z-index: 2;
      }

      @keyframes dawn {
        to {
          background-color: var(--field);
          color: var(--ink);
        }
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      #boot .pip {
        width: 96px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--glow), transparent);
        animation: sweep 1.6s ease-in-out infinite;
      }

      @keyframes sweep {
        0%,
        100% {
          opacity: 0.2;
          transform: scaleX(0.4);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @media (max-width: 640px) {
        .title h1 {
          font-size: 18px;
          letter-spacing: 0.3em;
        }
        .legend {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <div class="title">
        <h1>Anemoi</h1>
        <p>Wind farm &mdash; an hour before sunset</p>
      </div>

      <div class="legend">
        <div><span>space</span> <b>still the air</b></div>
        <div><span>O</span> <b>free orbit</b></div>
        <div><span>B</span> <b>sun glow</b></div>
        <div><span>G</span> <b>get up a wind</b></div>
        <div><span>R</span> <b>new weather</b></div>
        <div><span>H</span> <b>hide overlay</b></div>
      </div>

      <div class="stat">
        <i>wind</i> <b id="wind">&mdash;</b><br />
        <i>from</i> <b id="bearing">&mdash;</b><br />
        <i>output</i> <b id="output">&mdash;</b><br />
        <i>seed</i> <b id="seed">&mdash;</b><br />
        <span id="mode">running</span>
      </div>
    </div>

    <div id="boot">
      <div>walking out</div>
      <div class="pip"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
