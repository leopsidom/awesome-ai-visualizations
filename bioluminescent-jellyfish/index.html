<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Abyssal Drift — bioluminescent deep-sea</title>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <style>
      :root {
        --ink: #cfe9f2;
        --dim: #5d7f8e;
        --glow: #4fe3d0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #01050a;
        overflow: hidden;
        color: var(--ink);
        font: 400 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
      }

      canvas {
        display: block;
      }

      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      }

      #ui.hidden {
        opacity: 0;
      }

      .title {
        position: absolute;
        top: 24px;
        left: 24px;
      }

      .title h1 {
        margin: 0;
        font: 300 26px/1.1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--ink);
        text-shadow: 0 0 24px rgba(79, 227, 208, 0.45);
      }

      .title p {
        margin: 8px 0 0;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .legend {
        position: absolute;
        left: 24px;
        bottom: 24px;
        color: var(--dim);
        font-size: 11px;
      }

      .legend b {
        color: var(--ink);
        font-weight: 500;
      }

      .legend span {
        display: inline-block;
        min-width: 74px;
      }

      .stat {
        position: absolute;
        right: 24px;
        bottom: 24px;
        text-align: right;
        color: var(--dim);
        font-size: 11px;
      }

      .stat b {
        color: var(--glow);
        font-weight: 500;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: #01050a;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        transition: opacity 0.9s ease;
        z-index: 2;
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      #boot .pip {
        width: 96px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--glow), transparent);
        animation: sweep 1.6s ease-in-out infinite;
      }

      @keyframes sweep {
        0%,
        100% {
          opacity: 0.2;
          transform: scaleX(0.4);
        }
        50% {
          opacity: 1;
          transform: scaleX(1);
        }
      }

      @media (max-width: 640px) {
        .title h1 {
          font-size: 18px;
          letter-spacing: 0.3em;
        }
        .legend {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="ui">
      <div class="title">
        <h1>Abyssal Drift</h1>
        <p>Bioluminescent zone &mdash; 900 m</p>
      </div>

      <div class="legend">
        <div><span>space</span> <b>pause drift</b></div>
        <div><span>O</span> <b>free orbit</b></div>
        <div><span>B</span> <b>bloom</b></div>
        <div><span>R</span> <b>reseed colony</b></div>
        <div><span>H</span> <b>hide overlay</b></div>
      </div>

      <div class="stat">
        seed <b id="seed">—</b><br />
        <span id="mode">auto drift</span>
      </div>
    </div>

    <div id="boot">
      <div>descending</div>
      <div class="pip"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
