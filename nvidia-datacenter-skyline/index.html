<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The AI Factory — NVIDIA data-center GPUs as a data hall</title>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <style>
      :root {
        --ink: #e3eedb;
        --dim: #94a888;
        --faint: #5b6b52;
        --accent: #76b900;
        --panel: #0b100a;
        --line: rgba(140, 200, 90, 0.16);
        --font: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "Noto Sans CJK SC", monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; background: #050705; color: var(--ink);
        font: 13px/1.5 var(--font); overflow: hidden;
      }

      /* Stage and panel sit side by side (stacked on narrow screens); the panel never covers the scene. */
      #app { display: flex; height: 100%; height: 100dvh; }
      #stage { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; background: #060906; touch-action: none; }
      #stage canvas { display: block; position: relative; }
      /* The wafer backdrop (drawn by main.js): centred behind the WebGL canvas, faded, turning slowly. */
      #stage { background: radial-gradient(ellipse at 50% 40%, #1d3320 0%, #102014 45%, #0b140c 80%); }
      #stage { container-type: size; }
      #stage #wafer { position: absolute; left: 50%; top: 46%; width: min(94cqh, 120cqw); height: auto; aspect-ratio: 1;
                      transform: translate(-50%, -50%); opacity: 0.6; pointer-events: none;
                      animation: wafer-turn 600s linear infinite; }
      @keyframes wafer-turn { to { transform: translate(-50%, -50%) rotate(360deg); } }
      #side { flex: 0 0 300px; background: var(--panel); border-left: 1px solid var(--line); padding: 12px 16px; overflow: hidden; position: relative; }
      body.hide-side #side { display: none; }
      #close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--dim); font-size: 22px; cursor: pointer; padding: 4px 8px; }
      #open { position: absolute; top: 12px; right: 12px; z-index: 5; display: none; background: var(--panel); color: var(--ink);
              border: 1px solid var(--line); padding: 6px 10px; font: inherit; cursor: pointer; border-radius: 4px; }
      body.hide-side #open { display: block; }

      h1 { font-size: 15px; margin: 0 0 2px; color: var(--accent); }
      .sub { color: var(--dim); margin: 0 0 6px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); margin: 10px 0 5px; font-weight: 500; }
      label { display: block; cursor: pointer; color: var(--ink); padding: 1px 0; }
      label small, .hint { color: var(--dim); }
      .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      button.b { background: #13200f; color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 4px 10px; cursor: pointer; border-radius: 3px; }
      button.b:hover, button.b[aria-pressed="true"] { border-color: var(--accent); }
      button.b[aria-pressed="true"] { color: var(--accent); }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .measures { display: grid; grid-template-columns: 1fr 1fr; }
      .ramp { height: 10px; border-radius: 5px; background: linear-gradient(90deg, #2f8a3a, #76b900, #c8f56a); margin: 2px 0; }
      .enc { color: var(--dim); font-size: 12px; } .enc b { color: var(--ink); font-weight: 500; }
      .lang { display: flex; gap: 4px; margin: 4px 0 0; }
      .lang button { padding: 1px 8px; }

      #hud { position: absolute; left: 16px; top: 12px; pointer-events: none; }
      #hud .yr { font-size: 42px; color: var(--accent); line-height: 1; font-weight: 600; }
      #hud .m { color: var(--dim); }
      #notice { position: absolute; inset: auto 16px 16px 16px; color: #ffb74d; display: none; }

      #tip { position: absolute; pointer-events: none; background: rgba(8, 12, 7, 0.95); border: 1px solid var(--line); padding: 8px 10px;
             border-radius: 4px; font-size: 12px; min-width: 220px; display: none; z-index: 4; }
      #tip b { color: var(--accent); } #tip td { padding: 0 8px 0 0; } #tip td:first-child { color: var(--dim); }

      /* Detail card. It zooms out of the focused rack (driven from main.js so it tracks the rack while the
         camera glides), never scrolls, and is scaled to fit on a short stage. Wide: right column; narrow: bottom sheet. */
      /* Centred on the stage, over the scene; --card-a (the panel's card-opacity slider) sets how much shows through. */
      #card { position: absolute; z-index: 3; inset: 0; margin: auto; width: 360px; max-width: calc(100% - 16px); height: fit-content;
              overflow: hidden; display: none; will-change: transform, opacity;
              background: rgba(8, 12, 7, var(--card-a, 0.8)); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 8px;
              padding: 0 14px 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, calc(var(--card-a, 0.8) * 0.6));
              -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
      #card.on { display: block; }
      .cnav { display: flex; align-items: center; gap: 6px; padding: 9px 0 6px; }
      .cnav button { background: #13200f; color: var(--ink); border: 1px solid var(--line); font: inherit; height: 26px; min-width: 28px; border-radius: 3px; cursor: pointer; padding: 0 7px; }
      .cnav button:hover { border-color: var(--accent); } .cnav .sp { flex: 1; } #cpos { color: var(--dim); font-size: 11px; }
      #cn { font-size: 17px; font-weight: 700; line-height: 1.2; } #cs { color: var(--dim); font-size: 12px; margin: 2px 0 5px; }
      .badge { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 3px; border: 1px solid; margin-right: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
      #cms { color: #cfeaa8; background: rgba(118, 185, 0, 0.12); border-left: 2px solid var(--accent); padding: 3px 8px; margin: 6px 0 0; font-size: 12px; }
      .cg { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; font-size: 12.5px; margin: 8px 0; }
      .cg span:nth-child(odd) { color: var(--dim); } .cg span { white-space: nowrap; } .na { color: #666; }
      .ch3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); margin: 10px 0 4px; }
      .vs { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 1px 8px; font-size: 11.5px; } .vs b { color: var(--dim); font-weight: 400; }
      .up { color: #9be03a; } .dn { color: #ff8a65; }
      #cnote { color: var(--ink); opacity: 0.85; font-size: 12px; margin: 8px 0 0; }
      #cchk { color: var(--dim); font-size: 11px; margin-top: 5px; }
      /* the rack-to-card leader line, and the frame that runs ahead of the card during the zoom */
      #lead { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
      #ghost { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; border: 1.5px solid var(--accent); border-radius: 6px; display: none;
               box-shadow: 0 0 18px rgba(118, 185, 0, 0.55), inset 0 0 18px rgba(118, 185, 0, 0.25); }

      .lbl { color: var(--ink); font-size: 11px; white-space: nowrap; text-shadow: 0 0 4px #000; pointer-events: none; transition: opacity 0.2s; }
      .lbl.ms { color: #fff; background: rgba(118, 185, 0, 0.18); border: 1px solid rgba(118, 185, 0, 0.5); padding: 1px 5px; border-radius: 3px; }
      .lbl.ms i { display: block; font-style: normal; color: var(--dim); font-size: 10px; }
      .lbl.focus { color: #fff; background: rgba(118, 185, 0, 0.45); border: 1px solid #9be03a; padding: 1px 6px; border-radius: 3px; }
      .yrl { color: var(--faint); font-size: 12px; pointer-events: none; }
      body.no-labels .lbl { display: none; }

      /* Narrow / portrait: stage on top, panel below as a sheet. */
      @media (max-width: 760px), (max-aspect-ratio: 9/10) {
        #app { flex-direction: column; }
        #side { flex: 0 0 auto; max-height: 42%; overflow-y: auto; border-left: 0; border-top: 1px solid var(--line); padding: 12px 14px; }
        #hud .yr { font-size: 30px; } #hud .m { font-size: 11px; }
        .lbl { font-size: 10px; } .lbl.ms i { display: none; }
        #card { width: 80%; padding: 0 12px 9px; }
        .cnav { padding: 7px 0 4px; } #cs { margin: 1px 0 4px; } .cg { margin: 6px 0; font-size: 12px; }
        #cn { font-size: 15px; } #cchk { display: none; }
        #cnote { margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        h2 { margin: 12px 0 6px; }
      }
      /* 80% of a wider narrow stage has room for the specs in two pairs of columns */
      @media (min-width: 560px) and (max-width: 760px) { .cg { grid-template-columns: auto 1fr auto 1fr; } }
      @media (max-width: 400px) {
        .cg { gap: 1px 8px; font-size: 11px; } .vs { font-size: 11px; gap: 1px 6px; }
      }
      @media (prefers-reduced-motion: reduce) { .lbl { transition: none; } #ghost { display: none !important; } #stage #wafer { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="hud"><div class="yr" id="yr">2025</div><div class="m" id="hudm"></div></div>
        <div id="notice">The 3D scene could not start (WebGL or the three.js CDN is unavailable). · 3D 场景无法启动（WebGL 或 three.js CDN 不可用）。</div>
        <div id="tip"></div>
        <svg id="lead"><line id="leadl" stroke-width="1.5" stroke-dasharray="4 3" /><circle id="leadc" r="4" /></svg>
        <div id="ghost"></div>
        <div id="card" role="dialog" aria-live="polite">
          <div class="cnav">
            <button id="prev" data-i18n-title="prev">◀</button><span id="cpos"></span><button id="next" data-i18n-title="next">▶</button>
            <span class="sp"></span><button id="unfocus" data-i18n-title="close">×</button>
          </div>
          <div id="cn"></div>
          <div id="cs"></div>
          <div id="cbadges"></div>
          <div id="cms"></div>
          <div class="cg" id="cg"></div>
          <div class="ch3" data-i18n="change"></div>
          <div class="vs" id="cvs"></div>
          <p id="cnote"></p>
          <div id="cchk"></div>
        </div>
        <button id="open" data-i18n="controls"></button>
      </div>

      <aside id="side">
        <button id="close" data-i18n-title="hidePanel">×</button>
        <h1 data-i18n="title"></h1>
        <p class="sub" data-i18n="subtitle"></p>
        <div class="lang" role="group" aria-label="Language">
          <button class="b" data-lang="en">EN</button><button class="b" data-lang="zh">中文</button>
        </div>

        <h2 data-i18n="timeline"></h2>
        <div class="row">
          <button class="b" id="play"></button><button class="b" id="all" data-i18n="showAll"></button><button class="b" id="reset" data-i18n="resetView"></button>
        </div>
        <input type="range" id="year" min="2007" max="2025.99" step="0.01" value="2025.99" aria-label="Year" />
        <div class="row" style="margin: 2px 0 6px">
          <span class="hint" data-i18n="speed"></span>
          <input type="range" id="speed" min="0.25" max="3" step="0.25" value="1" style="flex: 1" aria-label="Speed" />
          <span id="speedv" style="width: 40px; text-align: right">1×</span>
        </div>
        <div class="row" style="margin: 0 0 4px" data-i18n-title="opacityHint">
          <span class="hint" data-i18n="cardOpacity"></span>
          <input type="range" id="alpha" min="40" max="100" step="5" value="80" style="flex: 1" aria-label="Card opacity" />
          <span id="alphav" style="width: 40px; text-align: right">80%</span>
        </div>
        <label><input type="checkbox" id="follow" checked /> <span data-i18n="follow"></span> <small>F</small></label>
        <label><input type="checkbox" id="labels" checked /> <span data-i18n="labels"></span></label>

        <h2 data-i18n="height"></h2>
        <div class="measures">
          <label><input type="radio" name="m" value="transistors" checked /> <span data-m="transistors"></span></label>
          <label><input type="radio" name="m" value="memory" /> <span data-m="memory"></span></label>
          <label><input type="radio" name="m" value="watts" /> <span data-m="watts"></span></label>
          <label><input type="radio" name="m" value="cores" /> <span data-m="cores"></span></label>
        </div>
        <div class="row" style="margin-top: 4px">
          <span class="hint" data-i18n="scale"></span>
          <button class="b" data-scale="linear"></button><button class="b" data-scale="log"></button>
          <small class="hint">L</small>
        </div>

        <h2 data-i18n="encoding"></h2>
        <div class="enc" data-i18n-html="encodingHtml"></div>

        <h2 data-i18n="colour"></h2>
        <div class="ramp"></div>
        <div class="row" style="justify-content: space-between"><small class="hint" data-i18n="rampSmall"></small><small class="hint" data-i18n="rampLarge"></small></div>
      </aside>
    </div>

    <script type="module">
      // main.js imports three.js; if the CDN or WebGL is unavailable the panel still shows, with a notice.
      import("./src/main.js").catch((err) => {
        console.error(err);
        document.getElementById("notice").style.display = "block";
      });
    </script>
  </body>
</html>
