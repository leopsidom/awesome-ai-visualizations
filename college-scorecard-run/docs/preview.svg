<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="ui-monospace, Menlo, monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#3a3566"/>
      <stop offset="0.78" stop-color="#c9756a"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26341f"/>
      <stop offset="1" stop-color="#3a5530"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3027"/>
      <stop offset="1" stop-color="#6b4334"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd99a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd99a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <g fill="#dfe7ff" opacity="0.8">
    <circle cx="110" cy="60" r="1.4"/><circle cx="320" cy="120" r="1.1"/><circle cx="520" cy="40" r="1.3"/>
    <circle cx="760" cy="90" r="1"/><circle cx="980" cy="50" r="1.5"/><circle cx="1180" cy="130" r="1.2"/>
    <circle cx="640" cy="160" r="0.9"/><circle cx="220" cy="190" r="1"/><circle cx="1090" cy="210" r="0.9"/>
  </g>

  <!-- halls and a clock tower -->
  <g fill="#3b2420">
    <rect x="0" y="330" width="250" height="130"/><polygon points="0,330 125,290 250,330"/>
    <rect x="1030" y="320" width="250" height="140"/><polygon points="1030,320 1155,282 1280,320"/>
    <rect x="1060" y="200" width="54" height="140"/><polygon points="1060,200 1087,150 1114,200"/>
  </g>
  <circle cx="1087" cy="232" r="14" fill="#f6e7c0"/>
  <g fill="#f2c46e">
    <rect x="30" y="360" width="16" height="26"/><rect x="90" y="360" width="16" height="26"/><rect x="170" y="400" width="16" height="26"/>
    <rect x="1070" y="350" width="16" height="26"/><rect x="1180" y="390" width="16" height="26"/>
  </g>

  <!-- ground and walk -->
  <rect y="440" width="1280" height="280" fill="url(#lawn)"/>
  <polygon points="560,440 720,440 1080,720 200,720" fill="url(#brick)"/>
  <g fill="#e6d6b4" opacity="0.8">
    <rect x="636" y="460" width="8" height="16"/><rect x="634" y="520" width="12" height="26"/><rect x="631" y="610" width="18" height="40"/>
  </g>

  <!-- trees -->
  <g fill="#2e5a35">
    <circle cx="300" cy="400" r="46"/><circle cx="380" cy="420" r="34"/><circle cx="930" cy="400" r="48"/><circle cx="860" cy="425" r="32"/>
  </g>

  <!-- lamps -->
  <g>
    <rect x="352" y="420" width="5" height="110" fill="#1d1f26"/><circle cx="354" cy="418" r="40" fill="url(#halo)"/>
    <rect x="924" y="420" width="5" height="110" fill="#1d1f26"/><circle cx="926" cy="418" r="40" fill="url(#halo)"/>
  </g>

  <!-- the gate: sign, pennants, arches -->
  <rect x="404" y="168" width="472" height="70" fill="#6a1924" stroke="#e6c36a" stroke-width="3"/>
  <text x="640" y="190" fill="#e6c36a" font-size="11" text-anchor="middle" letter-spacing="2">GATE 7 · EARNINGS</text>
  <text x="640" y="214" fill="#fbf3dc" font-size="21" font-weight="700" text-anchor="middle">Whose alumni earn more?</text>
  <text x="640" y="230" fill="#fbf3dc" opacity="0.75" font-size="10" text-anchor="middle">median earnings 10 years after entry</text>

  <rect x="444" y="250" width="178" height="96" fill="#101a33"/><rect x="444" y="250" width="6" height="96" fill="#5aa9ff"/>
  <text x="460" y="268" fill="#5aa9ff" font-size="10">PUBLIC</text>
  <text x="460" y="298" fill="#f6f1e3" font-size="22" font-weight="600">Georgia Tech</text>
  <text x="460" y="334" fill="#f6f1e3" opacity="0.7" font-size="10">Atlanta, GA</text>

  <rect x="658" y="250" width="178" height="96" fill="#101a33"/><rect x="658" y="250" width="6" height="96" fill="#f4b740"/>
  <text x="674" y="268" fill="#f4b740" font-size="10">PRIVATE NONPROFIT</text>
  <text x="674" y="292" fill="#f6f1e3" font-size="17" font-weight="600">Boston</text>
  <text x="674" y="312" fill="#f6f1e3" font-size="17" font-weight="600">University</text>
  <text x="674" y="334" fill="#f6f1e3" opacity="0.7" font-size="10">Boston, MA</text>

  <g fill="#d8c9a6">
    <rect x="440" y="350" width="186" height="16"/><rect x="444" y="366" width="16" height="122"/><rect x="606" y="366" width="16" height="122"/>
    <rect x="654" y="350" width="186" height="16"/><rect x="658" y="366" width="16" height="122"/><rect x="820" y="366" width="16" height="122"/>
  </g>
  <rect x="460" y="366" width="146" height="122" fill="#3ee08a" opacity="0.18"/>
  <rect x="674" y="366" width="146" height="122" fill="#f4b740" opacity="0.1"/>

  <!-- data columns -->
  <rect x="392" y="296" width="34" height="194" fill="#5aa9ff"/>
  <rect x="854" y="334" width="34" height="156" fill="#f4b740"/>
  <rect x="352" y="258" width="114" height="32" rx="10" fill="#1a5c3a" stroke="#7df0b0" stroke-width="2"/>
  <text x="409" y="280" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">$102,772</text>
  <rect x="814" y="296" width="114" height="32" rx="10" fill="#6e1c24" stroke="#ff9a9a" stroke-width="2"/>
  <text x="871" y="318" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">$83,238</text>

  <!-- the graduate -->
  <g transform="translate(540 560)">
    <ellipse cx="0" cy="92" rx="38" ry="9" fill="#000" opacity="0.35"/>
    <path d="M-34 88 L-24 6 L24 6 L34 88 Z" fill="#1c2a5a"/>
    <rect x="-12" y="8" width="7" height="58" fill="#e6c36a"/><rect x="5" y="8" width="7" height="58" fill="#e6c36a"/>
    <circle cx="0" cy="-12" r="17" fill="#d9a77f"/>
    <rect x="-16" y="-30" width="32" height="10" fill="#14161c"/>
    <polygon points="-34,-32 0,-46 34,-32 0,-20" fill="#14161c"/>
    <path d="M0 -36 L26 -30 L28 -12" stroke="#e6c36a" stroke-width="2.5" fill="none"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="500" y="330" width="7" height="10" fill="#f4b740" transform="rotate(20 500 330)"/>
    <rect x="560" y="300" width="7" height="10" fill="#5aa9ff" transform="rotate(-30 560 300)"/>
    <rect x="590" y="350" width="7" height="10" fill="#ff6f9a" transform="rotate(50 590 350)"/>
    <rect x="520" y="280" width="7" height="10" fill="#3ee08a" transform="rotate(10 520 280)"/>
    <rect x="470" y="300" width="7" height="10" fill="#fbf3dc" transform="rotate(-60 470 300)"/>
  </g>
</svg>
