<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="nvGlow" cx="52%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0.34"/>
      <stop offset="48%" stop-color="#3c6608" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#050907" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fp8Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8e03a"/>
      <stop offset="100%" stop-color="#4e7c00"/>
    </linearGradient>
    <linearGradient id="fp4Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4ff66"/>
      <stop offset="100%" stop-color="#76b900"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Obsidian + NVIDIA Green Studio Backdrop -->
  <rect width="1280" height="720" fill="#050907"/>
  <rect width="1280" height="720" fill="url(#nvGlow)"/>

  <!-- Perspective Grid Floor -->
  <g stroke="#244019" stroke-width="1" opacity="0.55">
    <line x1="60" y1="540" x2="1220" y2="540"/>
    <line x1="20" y1="590" x2="1260" y2="590"/>
    <line x1="0" y1="648" x2="1280" y2="648"/>
    <line x1="180" y1="500" x2="40" y2="720"/>
    <line x1="380" y1="500" x2="290" y2="720"/>
    <line x1="640" y1="500" x2="640" y2="720"/>
    <line x1="900" y1="500" x2="990" y2="720"/>
    <line x1="1100" y1="500" x2="1240" y2="720"/>
