  <!-- H100 -->
  <rect x="192" y="514" width="38" height="24" fill="url(#fp8Grad)" rx="2"/>
  <text x="211" y="504" fill="#a8e03a" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">63 PF</text>

  <!-- H200 -->
  <rect x="394" y="514" width="38" height="24" fill="url(#fp8Grad)" rx="2"/>
  <text x="413" y="504" fill="#a8e03a" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">63 PF</text>

