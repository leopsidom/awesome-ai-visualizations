    <text x="416" y="670" fill="#a8e03a" font-size="10">32 GPUs · 4N</text>

    <rect x="554" y="636" width="128" height="44" rx="7" fill="#070d0a" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="618" y="654" fill="#edf6f0" font-size="14" font-weight="700">B200</text>
    <text x="618" y="670" fill="#a8e03a" font-size="10">72 GPUs · 4NP</text>

    <rect x="762" y="636" width="128" height="44" rx="7" fill="#070d0a" stroke="#06b6d4" stroke-opacity="0.5"/>
    <text x="826" y="654" fill="#edf6f0" font-size="14" font-weight="700">B300</text>
